<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Office Debug Tool</title>
    
    <!-- Debug Console -->
    <script>
        // Enhanced error handling and logging
        window.debugLog = [];
        window.logDebug = function(message, data) {
            const timestamp = new Date().toISOString();
            const logEntry = { timestamp, message, data };
            window.debugLog.push(logEntry);
            console.log(`[DEBUG ${timestamp}] ${message}`, data || '');
            
            // Show in UI if debug container exists
            const debugContainer = document.getElementById('debug-output');
            if (debugContainer) {
                const logDiv = document.createElement('div');
                logDiv.innerHTML = `<strong>${timestamp}</strong>: ${message} ${data ? JSON.stringify(data) : ''}`;
                debugContainer.appendChild(logDiv);
                debugContainer.scrollTop = debugContainer.scrollHeight;
            }
        };
        
        // Capture all errors
        window.onerror = function(msg, url, line, col, error) {
            window.logDebug('JavaScript Error', { message: msg, url, line, col, error: error?.toString() });
            return false;
        };
        
        window.addEventListener('unhandledrejection', function(event) {
            window.logDebug('Unhandled Promise Rejection', { reason: event.reason });
        });
        
        window.logDebug('Starting Office Debug Tool');
    </script>
    
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Office Debug Information</h1>
            <button id="refresh-btn" class="refresh-btn">🔄 Refresh</button>
        </header>

        <div class="content">
            <!-- Debug Output Section -->
            <section class="info-section">
                <h2>Debug Output</h2>
                <div id="debug-output" class="info-content debug-output" style="max-height: 200px; overflow-y: auto; background: #f5f5f5; padding: 10px; font-family: monospace; font-size: 12px;">
                    <div>Debug console initialized...</div>
                </div>
                <button onclick="clearDebugLog()" style="margin-top: 5px;">Clear Debug Log</button>
            </section>

            <!-- Office Environment Section -->
            <section class="info-section">
                <h2>Office Environment</h2>
                <div id="office-info" class="info-content">
                    <div class="loading">Loading...</div>
                </div>
            </section>

            <!-- Document Information Section -->
            <section class="info-section">
                <h2>Document Information</h2>
                <div id="document-info" class="info-content">
                    <div class="loading">Loading...</div>
                </div>
            </section>

            <!-- Add-ins Information Section -->
            <section class="info-section">
                <h2>Add-ins Information</h2>
                <div id="addins-info" class="info-content">
                    <div class="loading">Loading...</div>
                </div>
            </section>

            <!-- System Information Section -->
            <section class="info-section">
                <h2>System Information</h2>
                <div id="system-info" class="info-content">
                    <div class="loading">Loading...</div>
                </div>
            </section>

            <!-- Context Information Section -->
            <section class="info-section">
                <h2>Office Context Details</h2>
                <div id="context-info" class="info-content">
                    <div class="loading">Loading...</div>
                </div>
            </section>
        </div>
    </div>

    <script>
        function clearDebugLog() {
            window.debugLog = [];
            const debugContainer = document.getElementById('debug-output');
            if (debugContainer) {
                debugContainer.innerHTML = '<div>Debug log cleared...</div>';
            }
        }
        
        // Log that HTML is loaded
        window.logDebug('HTML Document loaded');
        
        // Check if Office.js is loading
        if (typeof Office !== 'undefined') {
            window.logDebug('Office.js object found');
        } else {
            window.logDebug('Office.js object NOT found - script may not have loaded');
        }
    </script>
    
    <script src="taskpane.js"></script>
</body>
</html>
