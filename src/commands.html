<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
    <script>
        Office.onReady(() => {
            // Register the toggle function
        });

        // Toggle task pane visibility
        function toggleTaskPane(event) {
            // Check if task pane is already open
            Office.ribbon.requestUpdate({
                tabs: [{
                    id: "TabHome",
                    controls: [{
                        id: "TaskpaneButton",
                        enabled: true
                    }]
                }]
            });

            // Use Office.addin.showAsTaskpane to show or toggle the pane
            Office.addin.showAsTaskpane();
            
            // Complete the event
            event.completed();
        }

        // Make function globally available
        Office.actions = Office.actions || {};
        Office.actions.toggleTaskPane = toggleTaskPane;
    </script>
</body>
</html>
