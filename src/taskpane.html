<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Office Debug Tool</title>

    
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Office Debug Information</h1>
            <button id="refresh-btn" class="refresh-btn">🔄</button>
        </header>

        <div class="content">
            <!-- Tab Content Area -->
            <div class="tab-content-wrapper">
                <!-- Office Environment Tab Content -->
                <div id="tab-office" class="tab-content active">
                    <section class="info-section">
                        <h2>Office Environment</h2>
                        <div id="office-info" class="info-content">
                            <div class="loading">Loading...</div>
                        </div>
                    </section>
                </div>

                <!-- Document Information Tab Content -->
                <div id="tab-document" class="tab-content">
                    <section class="info-section">
                        <h2>Document Information</h2>
                        <div id="document-info" class="info-content">
                            <div class="loading">Loading...</div>
                        </div>
                    </section>
                </div>

                <!-- System Information Tab Content -->
                <div id="tab-system" class="tab-content">
                    <section class="info-section">
                        <h2>System Information</h2>
                        <div id="system-info" class="info-content">
                            <div class="loading">Loading...</div>
                        </div>
                    </section>
                </div>

                <!-- Add-ins Information Tab Content -->
                <div id="tab-addins" class="tab-content">
                    <section class="info-section">
                        <h2>Add-ins Information</h2>
                        <div id="addins-info" class="info-content">
                            <div class="loading">Loading...</div>
                        </div>
                    </section>
                </div>

                <!-- DMS Information Tab Content -->
                <div id="tab-dms" class="tab-content">
                    <section class="info-section">
                        <h2>Document Management System</h2>
                        <div id="dms-info" class="info-content">
                            <div class="loading">Detecting DMS...</div>
                        </div>
                    </section>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-button active" data-tab="tab-office">
                    <span class="tab-icon">🏢</span>
                    <span class="tab-label">Office Environment</span>
                </button>
                <button class="tab-button" data-tab="tab-document">
                    <span class="tab-icon">📄</span>
                    <span class="tab-label">Document Info</span>
                </button>
                <button class="tab-button" data-tab="tab-system">
                    <span class="tab-icon">💻</span>
                    <span class="tab-label">System Info</span>
                </button>
                <button class="tab-button" data-tab="tab-addins">
                    <span class="tab-icon">🧩</span>
                    <span class="tab-label">Add-in Info</span>
                </button>
                <button class="tab-button" data-tab="tab-dms">
                    <span class="tab-icon">📁</span>
                    <span class="tab-label">DMS</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function clearDebugLog() {
            window.debugLog = [];
            const debugContainer = document.getElementById('debug-output');
            if (debugContainer) {
                debugContainer.innerHTML = '<div>Debug log cleared...</div>';
            }
        }
        
        // Tab switching functionality
        function initializeTabs() {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove active class from all buttons and contents
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));
                    
                    // Add active class to clicked button
                    button.classList.add('active');
                    
                    // Show corresponding tab content
                    const tabId = button.getAttribute('data-tab');
                    const tabContent = document.getElementById(tabId);
                    if (tabContent) {
                        tabContent.classList.add('active');
                    }
                });
            });
        }
        
        // Initialize tabs when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeTabs);
        } else {
            initializeTabs();
        }
        
        // Check if Office.js is loading
        if (typeof Office !== 'undefined') {
            // Office.js object found
        } else {
            // Office.js object NOT found
        }
        
        // Tab switching functionality
        function switchTab(tabId) {
            // Hide all tab contents
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all tab buttons
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.classList.remove('active');
            });
            
            // Show the selected tab content
            const selectedTab = document.getElementById(tabId);
            if (selectedTab) {
                selectedTab.classList.add('active');
            }
            
            // Add active class to the clicked button
            const selectedButton = document.querySelector(`[data-tab="${tabId}"]`);
            if (selectedButton) {
                selectedButton.classList.add('active');
            }
        }
        
        // Initialize tab functionality when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const tabId = this.getAttribute('data-tab');
                    switchTab(tabId);
                });
            });
        });
    </script>
    
    <script src="taskpane.js"></script>
</body>
</html>
