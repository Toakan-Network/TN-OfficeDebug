<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Office Debug Tool</title>
    
    <!-- Debug Console -->
    <script>
        // Enhanced error handling and logging
        window.debugLog = [];
        window.logDebug = function(message, data) {
            const timestamp = new Date().toISOString();
            const logEntry = { timestamp, message, data };
            window.debugLog.push(logEntry);
            console.log(`[DEBUG ${timestamp}] ${message}`, data || '');
            
            // Show in UI if debug container exists
            const debugContainer = document.getElementById('debug-output');
            if (debugContainer) {
                const logDiv = document.createElement('div');
                logDiv.innerHTML = `<strong>${timestamp}</strong>: ${message} ${data ? JSON.stringify(data) : ''}`;
                debugContainer.appendChild(logDiv);
                debugContainer.scrollTop = debugContainer.scrollHeight;
            }
        };
        
        // Capture all errors
        window.onerror = function(msg, url, line, col, error) {
            window.logDebug('JavaScript Error', { message: msg, url, line, col, error: error?.toString() });
            return false;
        };
        
        window.addEventListener('unhandledrejection', function(event) {
            window.logDebug('Unhandled Promise Rejection', { reason: event.reason });
        });
        
        window.logDebug('Starting Office Debug Tool');
    </script>
    
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Office Debug Information</h1>
            <button id="refresh-btn" class="refresh-btn">🔄 Refresh</button>
        </header>

        <div class="content">
            <!-- Tab Content Area -->
            <div class="tab-content-wrapper">
                <!-- Office Environment Tab Content -->
                <div id="tab-office" class="tab-content active">
                    <section class="info-section">
                        <h2>Office Environment</h2>
                        <div id="office-info" class="info-content">
                            <div class="loading">Loading...</div>
                        </div>
                    </section>
                </div>

                <!-- Document Information Tab Content -->
                <div id="tab-document" class="tab-content">
                    <section class="info-section">
                        <h2>Document Information</h2>
                        <div id="document-info" class="info-content">
                            <div class="loading">Loading...</div>
                        </div>
                    </section>
                </div>

                <!-- System Information Tab Content -->
                <div id="tab-system" class="tab-content">
                    <section class="info-section">
                        <h2>System Information</h2>
                        <div id="system-info" class="info-content">
                            <div class="loading">Loading...</div>
                        </div>
                    </section>
                </div>

                <!-- Add-ins Information Tab Content -->
                <div id="tab-addins" class="tab-content">
                    <section class="info-section">
                        <h2>Add-ins Information</h2>
                        <div id="addins-info" class="info-content">
                            <div class="loading">Loading...</div>
                        </div>
                    </section>
                </div>

                <!-- Debug Output Tab Content -->
                <div id="tab-debug" class="tab-content">
                    <section class="info-section">
                        <h2>Debug Output</h2>
                        <div id="debug-output" class="info-content debug-output" style="max-height: 300px; overflow-y: auto; background: #f5f5f5; padding: 6px; font-family: monospace; font-size: 10px;">
                            <div>Debug console initialized...</div>
                        </div>
                        <button onclick="clearDebugLog()" style="margin-top: 5px; padding: 4px 8px; font-size: 11px;">Clear Debug Log</button>
                    </section>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-button active" data-tab="tab-office">
                    <span class="tab-icon">🏢</span>
                    <span class="tab-label">Office Environment</span>
                </button>
                <button class="tab-button" data-tab="tab-document">
                    <span class="tab-icon">📄</span>
                    <span class="tab-label">Document Info</span>
                </button>
                <button class="tab-button" data-tab="tab-system">
                    <span class="tab-icon">💻</span>
                    <span class="tab-label">System Info</span>
                </button>
                <button class="tab-button" data-tab="tab-addins">
                    <span class="tab-icon">🧩</span>
                    <span class="tab-label">Add-in Info</span>
                </button>
                <button class="tab-button" data-tab="tab-debug">
                    <span class="tab-icon">🐛</span>
                    <span class="tab-label">Debug Output</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function clearDebugLog() {
            window.debugLog = [];
            const debugContainer = document.getElementById('debug-output');
            if (debugContainer) {
                debugContainer.innerHTML = '<div>Debug log cleared...</div>';
            }
        }
        
        // Tab switching functionality
        function initializeTabs() {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove active class from all buttons and contents
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));
                    
                    // Add active class to clicked button
                    button.classList.add('active');
                    
                    // Show corresponding tab content
                    const tabId = button.getAttribute('data-tab');
                    const tabContent = document.getElementById(tabId);
                    if (tabContent) {
                        tabContent.classList.add('active');
                    }
                });
            });
        }
        
        // Initialize tabs when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeTabs);
        } else {
            initializeTabs();
        }
        
        // Log that HTML is loaded
        window.logDebug('HTML Document loaded');
        
        // Check if Office.js is loading
        if (typeof Office !== 'undefined') {
            window.logDebug('Office.js object found');
        } else {
            window.logDebug('Office.js object NOT found - script may not have loaded');
        }
        
        // Tab switching functionality
        function switchTab(tabId) {
            // Hide all tab contents
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all tab buttons
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.classList.remove('active');
            });
            
            // Show the selected tab content
            const selectedTab = document.getElementById(tabId);
            if (selectedTab) {
                selectedTab.classList.add('active');
            }
            
            // Add active class to the clicked button
            const selectedButton = document.querySelector(`[data-tab="${tabId}"]`);
            if (selectedButton) {
                selectedButton.classList.add('active');
            }
            
            window.logDebug('Switched to tab', { tabId });
        }
        
        // Initialize tab functionality when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const tabId = this.getAttribute('data-tab');
                    switchTab(tabId);
                });
            });
        });
    </script>
    
    <script src="taskpane.js"></script>
</body>
</html>
