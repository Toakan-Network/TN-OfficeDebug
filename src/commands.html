<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
    <script>
        Office.onReady(() => {
            // Register visibility change handler to track state
            if (Office.addin && Office.addin.onVisibilityModeChanged) {
                Office.addin.onVisibilityModeChanged((message) => {
                    isTaskPaneVisible = (message.visibilityMode === Office.VisibilityMode.taskpane);
                }).catch(error => {
                    console.log('Visibility change handler not available:', error);
                });
            }
        });

        // Track task pane visibility state
        let isTaskPaneVisible = false;

        // Toggle task pane visibility
        function toggleTaskPane(event) {
            try {
                if (isTaskPaneVisible) {
                    // Hide the task pane
                    Office.addin.hide().then(() => {
                        isTaskPaneVisible = false;
                        event.completed();
                    }).catch(error => {
                        console.error('Error hiding task pane:', error);
                        event.completed();
                    });
                } else {
                    // Show the task pane
                    Office.addin.showAsTaskpane().then(() => {
                        isTaskPaneVisible = true;
                        event.completed();
                    }).catch(error => {
                        console.error('Error showing task pane:', error);
                        event.completed();
                    });
                }
            } catch (error) {
                console.error('Error in toggleTaskPane:', error);
                event.completed();
            }
        }

        // Make function globally available
        Office.actions = Office.actions || {};
        Office.actions.toggleTaskPane = toggleTaskPane;
    </script>
</body>
</html>
